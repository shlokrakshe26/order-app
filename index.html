<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>राखी स्टोअर - Rakhi Store</title>
  <style>
    :root {
      --primary-color: #b30000;
      --secondary-color: #ff9900;
      --bg-color: #fff8f0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0; padding: 0;
      background-color: var(--bg-color);
      color: #333;
    }
    header {
      background: linear-gradient(135deg, #b30000, #e65c00);
      color: white; text-align: center; padding: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    h1 { margin: 0; font-size: 22px; }
    .subtitle { margin-top: 4px; font-size: 12px; opacity: 0.9; }
    .container { max-width: 600px; margin: 15px auto; padding: 0 12px; }
    .top-bar { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
    .btn-group { display: flex; gap: 8px; width: 100%; }
    .btn {
      flex: 1;
      background-color: var(--primary-color); color: white;
      padding: 10px; border: none; border-radius: 6px;
      cursor: pointer; font-weight: bold; font-size: 13px; text-align: center;
    }
    .btn:active { opacity: 0.8; }
    .btn-success { background-color: #28a745; }
    .btn-info { background-color: #17a2b8; }
    .btn-danger { background-color: #dc3545; padding: 4px 8px; font-size: 11px; margin-top: 6px; border-radius: 4px; border: none; color: white; cursor: pointer; }
    
    .rakhi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .rakhi-card {
      background: white; border-radius: 10px; overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08); text-align: center; position: relative; padding-bottom: 8px;
    }
    .rakhi-card img { width: 100%; height: 130px; object-fit: cover; cursor: pointer; }
    .rakhi-card-body { padding: 8px; }
    .rakhi-title { font-size: 15px; font-weight: bold; color: #b30000; margin-bottom: 4px; cursor: pointer; }
    .rakhi-price { font-size: 14px; color: #28a745; font-weight: bold; margin-top: 4px; }
    .rakhi-stock { font-size: 11px; color: #e65c00; font-weight: bold; }
    .out-of-stock { opacity: 0.6; }
    .badge-out { position: absolute; top: 5px; right: 5px; background: red; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; }

    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: flex-end;
    }
    .modal-content {
      background: white; padding: 20px; border-radius: 15px 15px 0 0;
      width: 100%; max-height: 85vh; overflow-y: auto; box-sizing: border-box; position: relative;
    }
    .close-btn { position: absolute; right: 15px; top: 10px; font-size: 24px; cursor: pointer; }
    .modal img { width: 100%; max-height: 180px; object-fit: contain; border-radius: 8px; }
    input, textarea { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    .order-card { background: #f9f9f9; border-left: 4px solid #b30000; padding: 10px; margin-bottom: 8px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>

  <header>
    <h1>🚩 राखी कलेक्शन स्टोअर 🚩</h1>
    <p class="subtitle">तुमच्या आवडत्या राख्या ऑनलाइन ऑर्डर करा</p>
  </header>

  <div class="container">
    <div class="top-bar">
      <div class="btn-group">
        <button class="btn btn-info" onclick="openMyOrdersModal()">📦 माझी ऑर्डर</button>
        <button class="btn" onclick="checkPasswordAndOpenAllOrders()">📋 सर्व ऑर्डर्स</button>
      </div>
      <button class="btn btn-success" onclick="checkPasswordAndOpenUpload()">+ राखी अपलोड करा (Admin)</button>
    </div>

    <h3 style="margin: 10px 0;">उपलब्ध राख्या</h3>
    <div id="rakhiContainer" class="rakhi-grid"><p>राख्या लोड होत आहेत...</p></div>
  </div>

  <!-- Upload Modal -->
  <div id="uploadModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('uploadModal')">&times;</span>
      <h3>नवीन राखी जोडा</h3>
      <input type="file" id="uploadImageFile" accept="image/*" onchange="previewFileImage(event)">
      <input type="text" id="uploadName" placeholder="राखीचे नाव">
      <input type="number" id="uploadPrice" placeholder="किंमत (₹)">
      <input type="number" id="uploadStock" placeholder="स्टॉक/साठा (नग संख्या)">
      <button class="btn btn-success" style="width:100%; margin-top:10px;" onclick="uploadRakhiToFirebase()">Firebase वर अपलोड करा</button>
    </div>
  </div>

  <!-- Order Placement Modal -->
  <div id="orderModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('orderModal')">&times;</span>
      <img id="modalRakhiImage" src="" alt="Rakhi">
      <h3 id="modalRakhiTitle" style="color:#b30000; margin:5px 0;"></h3>
      <p id="modalRakhiPrice" style="font-size:16px; font-weight:bold; color:#28a745; margin:4px 0;"></p>
      <p id="modalRakhiStock" style="font-size:12px; color:#e65c00; font-weight:bold;"></p>
      <hr>
      <h4>ऑर्डरसाठी माहिती भरा:</h4>
      <input type="text" id="custName" placeholder="तुमचे पूर्ण नाव">
      <textarea id="custAddress" placeholder="पूर्ण पत्ता (Address)" rows="2"></textarea>
      <input type="number" id="custQty" placeholder="नग (Quantity)" value="1" min="1">
      <input type="tel" id="custPhone" placeholder="मोबाईल नंबर">
      <button class="btn btn-success" style="width:100%; margin-top:10px;" onclick="placeOrder()">ऑर्डर कन्फर्म करा</button>
    </div>
  </div>

  <!-- My Orders Modal -->
  <div id="myOrdersModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('myOrdersModal')">&times;</span>
      <h3>माझी ऑर्डर शोधा</h3>
      <input type="tel" id="searchPhone" placeholder="ऑर्डर करताना टाकलेला मोबाईल नंबर">
      <button class="btn btn-info" style="width:100%;" onclick="fetchMyOrders()">ऑर्डर शोधा</button>
      <div id="myOrdersList" style="margin-top:15px;"></div>
    </div>
  </div>

  <!-- All Orders Modal (Admin) -->
  <div id="allOrdersModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('allOrdersModal')">&times;</span>
      <h3>सर्व ऑर्डर्स (Admin)</h3>
      <div id="allOrdersList" style="margin-top:10px;"><p>ऑर्डर्स लोड होत आहेत...</p></div>
    </div>
  </div>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyANVkGgaGr_A8M-9DsgfE3YSEAwQ5aGTRM",
      authDomain: "order-app-c0c38.firebaseapp.com",
      databaseURL: "https://order-app-c0c38-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "order-app-c0c38",
      storageBucket: "order-app-c0c38.firebasestorage.app",
      messagingSenderId: "16039614346",
      appId: "1:16039614346:web:46fc8a3afb5d0bd98bda73",
      measurementId: "G-XYH5G6T5KR"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    let selectedRakhi = null;
    let selectedRakhiKey = "";
    let base64Image = "";

    window.closeModal = id => document.getElementById(id).style.display = "none";

    window.checkPasswordAndOpenUpload = function() {
      if (prompt("ॲडमिन पासवर्ड टाका:") === "0000") {
        document.getElementById("uploadModal").style.display = "flex";
      } else alert("चुकीचा पासवर्ड!");
    };

    window.checkPasswordAndOpenAllOrders = function() {
      if (prompt("ॲडमिन पासवर्ड टाका:") === "0000") {
        document.getElementById("allOrdersModal").style.display = "flex";
        loadAllOrders();
      } else alert("चुकीचा पासवर्ड!");
    };

    window.openMyOrdersModal = function() {
      document.getElementById("myOrdersModal").style.display = "flex";
      document.getElementById("myOrdersList").innerHTML = "";
    };

    window.previewFileImage = function(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = e => {
          base64Image = e.target.result;
          if (!document.getElementById("uploadName").value) {
            document.getElementById("uploadName").value = file.name.split('.')[0];
          }
        };
        reader.readAsDataURL(file);
      }
    };

    // Upload Rakhi Without Description
    window.uploadRakhiToFirebase = function() {
      const name = document.getElementById("uploadName").value.trim();
      const price = document.getElementById("uploadPrice").value.trim();
      const stock = document.getElementById("uploadStock").value.trim();
      const image = base64Image || "https://via.placeholder.com/200?text=Rakhi";

      if (!name || !price || !stock) return alert("कृपया नाव, किंमत आणि स्टॉक टाका!");

      push(ref(database, 'rakhis'), { 
        name, price: Number(price), stock: Number(stock), image, timestamp: Date.now() 
      }).then(() => {
        alert("राखी अपलोड झाली!");
        document.getElementById("uploadName").value = "";
        document.getElementById("uploadPrice").value = "";
        document.getElementById("uploadStock").value = "";
        document.getElementById("uploadImageFile").value = "";
        base64Image = "";
        closeModal("uploadModal");
      }).catch(err => alert("एरर: " + err.message));
    };

    // Delete Rakhi Function (With Password 0000)
    window.deleteRakhi = function(key, event) {
      event.stopPropagation();
      if (prompt("राखी डिलीट करण्यासाठी ॲडमिन पासवर्ड टाका:") === "0000") {
        if (confirm("तुम्हाला ही राखी खरंच काढून टाकायची आहे का?")) {
          remove(ref(database, 'rakhis/' + key))
            .then(() => alert("राखी काढण्यात आली आहे!"))
            .catch(err => alert("एरर: " + err.message));
        }
      } else {
        alert("चुकीचा पासवर्ड!");
      }
    };

    // Load Rakhis Grid
    onValue(ref(database, 'rakhis'), snapshot => {
      const container = document.getElementById("rakhiContainer");
      container.innerHTML = "";
      const data = snapshot.val();
      if (data) {
        Object.keys(data).forEach(key => {
          const item = data[key];
          const isOut = item.stock <= 0;
          const card = document.createElement("div");
          card.className = "rakhi-card " + (isOut ? "out-of-stock" : "");
          
          card.innerHTML = `
            ${isOut ? '<span class="badge-out">Out of Stock</span>' : ''}
            <img src="${item.image}" onclick="openRakhiModalByCard('${key}')" onerror="this.src='https://via.placeholder.com/200?text=Rakhi'">
            <div class="rakhi-card-body">
              <div class="rakhi-title" onclick="openRakhiModalByCard('${key}')">${item.name}</div>
              <div class="rakhi-price">₹${item.price}</div>
              <div class="rakhi-stock">साठा: ${item.stock} नग</div>
              <button class="btn-danger" onclick="deleteRakhi('${key}', event)">🗑️ डिलीट करा</button>
            </div>`;
          container.appendChild(card);
        });
      } else container.innerHTML = "<p>राखी उपलब्ध नाही.</p>";
    });

    window.openRakhiModalByCard = function(key) {
      onValue(ref(database, 'rakhis/' + key), snapshot => {
        const item = snapshot.val();
        if (item) {
          if (item.stock <= 0) return alert("ही राखी Out of Stock झाली आहे!");
          openOrderModal(item, key);
        }
      }, { onlyOnce: true });
    };

    window.openOrderModal = function(rakhi, key) {
      selectedRakhi = rakhi;
      selectedRakhiKey = key;
      document.getElementById("modalRakhiImage").src = rakhi.image;
      document.getElementById("modalRakhiTitle").innerText = rakhi.name;
      document.getElementById("modalRakhiPrice").innerText = "किंमत: ₹" + rakhi.price;
      document.getElementById("modalRakhiStock").innerText = "उपलब्ध साठा: " + rakhi.stock + " नग";
      document.getElementById("orderModal").style.display = "flex";
    };

    // Place Order & Auto Reduce Stock
    window.placeOrder = function() {
      const name = document.getElementById("custName").value.trim();
      const address = document.getElementById("custAddress").value.trim();
      const qty = Number(document.getElementById("custQty").value.trim());
      const phone = document.getElementById("custPhone").value.trim();

      if (!name || !address || !qty || !phone) return alert("सर्व माहिती भरा!");
      if (qty > selectedRakhi.stock) return alert("शक्य नाही! उपलब्ध साठ्यापेक्षा जास्त नग टाकले आहेत.");

      // Push Order
      push(ref(database, 'orders'), {
        rakhiName: selectedRakhi.name, price: selectedRakhi.price,
        customerName: name, address, quantity: qty, phone,
        totalAmount: selectedRakhi.price * qty, orderDate: new Date().toLocaleString()
      }).then(() => {
        // Auto Reduce Stock in Firebase
        const newStock = selectedRakhi.stock - qty;
        update(ref(database, 'rakhis/' + selectedRakhiKey), { stock: newStock });

        alert("ऑर्डर यशस्वी झाली!");
        closeModal("orderModal");
      }).catch(err => alert("एरर: " + err.message));
    };

    window.fetchMyOrders = function() {
      const phone = document.getElementById("searchPhone").value.trim();
      if (!phone) return alert("मोबाईल नंबर टाका!");

      onValue(ref(database, 'orders'), snapshot => {
        const list = document.getElementById("myOrdersList");
        list.innerHTML = "";
        const data = snapshot.val();
        let found = false;

        if (data) {
          Object.keys(data).forEach(key => {
            const order = data[key];
            if (order.phone === phone) {
              found = true;
              list.innerHTML += `
                <div class="order-card">
                  <b>राखी:</b> ${order.rakhiName} (${order.quantity} नग)<br>
                  <b>एकूण बिल:</b> ₹${order.totalAmount}<br>
                  <b>तारीख:</b> ${order.orderDate}
                </div>`;
            }
          });
        }
        if (!found) list.innerHTML = "<p>या नंबरवर कोणतीही ऑर्डर सापडली नाही.</p>";
      }, { onlyOnce: true });
    };

    function loadAllOrders() {
      onValue(ref(database, 'orders'), snapshot => {
        const list = document.getElementById("allOrdersList");
        list.innerHTML = "";
        const data = snapshot.val();

        if (data) {
          Object.keys(data).forEach(key => {
            const order = data[key];
            list.innerHTML += `
              <div class="order-card">
                <b>ग्राहक:</b> ${order.customerName} (${order.phone})<br>
                <b>राखी:</b> ${order.rakhiName} | <b>नग:</b> ${order.quantity}<br>
                <b>रक्कम:</b> ₹${order.totalAmount}<br>
                <b>पत्ता:</b> ${order.address}<br>
                <small><b>तारीख:</b> ${order.orderDate}</small>
              </div>`;
          });
        } else list.innerHTML = "<p>अजून एकही ऑर्डर आलेली नाही.</p>";
      }, { onlyOnce: true });
    }
  </script>
</body>
</html>
